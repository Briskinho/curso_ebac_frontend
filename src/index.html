<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador de nomes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="@@ENDERECO_DO_CSS">
</head>
<body>
    <main class="container">
        <h1>Sorteador de Nomes</h1>
        <form id="form-sorteador">
            <div>
                <label for="nomes-input">Digite os nomes (separados por virgula):</label>
                <textarea id="nomes-input" placeholder="Ex: Bruno, Carlos, Daniel" required rows="3"></textarea>
            </div>
            <button type="submit" id="btn-sortear">Sortear nomes</button>
            <button type="button" id="btn-limpar" class="btn-secundario">Limpar tudo</button>
        </form>
        <div class="lista-container" id="lista-container" style="display: none;">
            <h3>Nomes cadastrados para o sorteio</h3>
            <ul id="lista-nomes"></ul>
        </div>
        <div class="resultado">
            O nome sorteado foi: <span id="resultado-valor"></span>
        </div>
    </main>
    <script src="@@ENDERECO_DO_JS"></script>
</body>
</html>
