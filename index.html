<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Github</title>
    <link rel="stylesheet" href="main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <!-- adicionando uma busca de usuario no github -->
    <div id="search-screen" class="container-fluid vh-100 d-flex justify-content-center align-items-center">
        <div class="text-center w-100" style="max-width: 400px;">
            <i class="bi bi-github mb-3" style="font-size: 4rem;"></i>
            <h2 class="mb-4">Buscar Perfil</h2>
            <div class="input-group">
                <input type="text" id="github-username" class="form-control" placeholder="Digite o usuário do GitHub">
                <button class="btn btn-primary" type="button" id="btn-buscar-github">
                    <i class="bi bi-search"></i>
                </button>
            </div>
        </div>
    </div>
    <header id="profile-screen" class="d-none">
        <div class="container">
            <img id="avatar" class="profile-avatar" src="https://via.placeholder.com/180x180" alt="Avatar">
            <h1 id="name" class="profile-name">Gian Souza</h1>
            <h2 id="username" class="profile-username">@ogiansouza</h2>
            <ul class="numbers">
                <li class="numbers-item">
                    <h4>Repositórios</h4>
                    <span id="repos">0</span>
                </li>
                <li class="numbers-item">
                    <h4>Seguidores</h4>
                    <span id="followers">0</span>
                </li>
                <li class="numbers-item">
                    <h4>Seguindo</h4>
                    <span id="following">0</span>
                </li>
            </ul>
            <a id="profile-link" href="#" target="_blank" class="profile-link">Ver no Github</a>
            <!-- botão para voltar na busca -->
            <div class="mt-2">
                <button id="btn-nova-busca" class="btn btn-outline-secondary btn-sm">Nova Busca</button>
            </div>
        </div>
    </header>
    <script src="jquery.js"></script>
    <script src="jquery.mask.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
